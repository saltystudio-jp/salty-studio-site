<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>箱をえらぶ、開く、知る — SALTY STUDIO（プロトタイプ）</title>
<meta name="description" content="SALTY STUDIOの新しいWeb体験プロトタイプ。ゲームの箱を選び、開き、中身に触れるように作品を知るUX試作です。">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="proto-badge">PROTOTYPE</div>

<header class="topbar">
  <span class="brand">SALTY STUDIO</span>
  <p class="topbar-hint" id="topbarHint">箱をえらんでください</p>
</header>

<main>
  <section class="stage" id="stage" aria-label="ゲーム箱をえらぶステージ">
    <canvas id="scene3d" aria-hidden="true"></canvas>
    <div class="stage-fallback" id="stageFallback" hidden>
      <p>このブラウザでは3D表示を利用できないため、簡易表示にしています。</p>
    </div>
    <button class="nav-arrow nav-prev" id="navPrev" aria-label="前の作品">‹</button>
    <button class="nav-arrow nav-next" id="navNext" aria-label="次の作品">›</button>
  </section>

  <div class="caption-bar" id="captionBar">
    <div class="caption-text">
      <h2 id="capTitle"></h2>
      <p class="cap-tag" id="capTag"></p>
    </div>
    <button class="btn-open" id="btnOpen">箱を開く</button>
  </div>

  <nav class="rail" id="rail" aria-label="作品をえらぶ"></nav>
  <p class="rm-note" id="rmNote" hidden>「視差効果を減らす」設定が有効なため、アニメーションを簡略化して表示しています。</p>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-head">
      <button class="btn-close" id="btnClose">← 箱を閉じて一覧へ戻る</button>
      <button class="btn-text" id="btnOther">別の作品を見る ›</button>
    </div>
    <div class="detail-body" id="detailBody">
      <div class="detail-info" id="detailInfo"></div>
    </div>
  </section>
</main>

<noscript>
  <p>このページはJavaScriptによる操作を前提としたプロトタイプです。JavaScriptを有効にしてご覧ください。各作品の情報は <a href="/games/">ゲーム一覧ページ</a> でも確認できます。</p>
</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./data.js"></script>
<script src="./scene.js"></script>
<script src="./app.js"></script>
</body>
</html>
